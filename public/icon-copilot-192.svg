<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="copilotBg192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="copilotGold192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="copilotGlow192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="192" height="192" rx="42" fill="url(#copilotBg192)" />
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="url(#copilotGold192)" stroke-width="2.5" opacity="0.9" />
  
  <!-- Ambient glow circle -->
  <circle cx="96" cy="86" r="62" fill="url(#copilotGlow192)" stroke="url(#copilotGold192)" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- AI Copilot Bot & Sparkle Motif -->
  <g transform="translate(96, 82)">
    <!-- Bot Antenna -->
    <line x1="0" y1="-44" x2="0" y2="-32" stroke="url(#copilotGold192)" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="-45" r="4.5" fill="#fef08a" />
    
    <!-- Bot Head -->
    <rect x="-34" y="-32" width="68" height="52" rx="14" fill="#0f172a" stroke="url(#copilotGold192)" stroke-width="2.5" />
    
    <!-- Bot Screen / Visor -->
    <rect x="-24" y="-22" width="48" height="24" rx="7" fill="#020617" stroke="#38bdf8" stroke-width="1" />
    
    <!-- Bot Glowing Eyes -->
    <circle cx="-12" cy="-10" r="5" fill="#38bdf8" />
    <circle cx="12" cy="-10" r="5" fill="#38bdf8" />
    <circle cx="-10" cy="-12" r="1.5" fill="#ffffff" />
    <circle cx="14" cy="-12" r="1.5" fill="#ffffff" />

    <!-- AI Sparkles -->
    <path d="M 32 -36 Q 32 -26 42 -26 Q 32 -26 32 -16 Q 32 -26 22 -26 Q 32 -26 32 -36 Z" fill="url(#copilotGold192)" />
    <path d="M -34 16 Q -34 22 -28 22 Q -34 22 -34 28 Q -34 22 -40 22 Q -34 22 -34 16 Z" fill="#38bdf8" />
  </g>

  <!-- Copilote Banner Badge -->
  <rect x="28" y="146" width="136" height="24" rx="12" fill="#0f172a" stroke="url(#copilotGold192)" stroke-width="1.5" />
  <text x="96" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" letter-spacing="2" fill="url(#copilotGold192)">COPILOTE</text>
</svg>
