  <g transform="translate(256, 230) translate(-65, -95)">
    <rect width="130" height="190" rx="14" fill="#0f172a" stroke="url(#mGoldGrad)" stroke-width="4" />
    <text x="16" y="34" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="url(#mGoldGrad)">3</text>
    <path d="M 65 60 L 100 100 L 65 140 L 30 100 Z" fill="url(#mGoldGrad)" />
  </g>

  <g transform="translate(256, 395)">
    <rect x="-130" y="-22" width="260" height="38" rx="19" fill="#020617" stroke="url(#mGoldGrad)" stroke-width="2" />
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="2" fill="url(#mGoldGrad)">NJAMBO KORA</text>
  </g>
