<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#041a14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="feltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />
  
  <!-- Inner Felt Table -->
  <circle cx="256" cy="256" r="195" fill="url(#feltGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Fan of Playing Cards in the center -->
  <!-- Left Card (Spade) -->
  <g transform="translate(210, 240) rotate(-18) translate(-65, -95)" filter="url(#shadow)">
    <rect width="130" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <text x="14" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#0f172a">A</text>
    <text x="14" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#0f172a">♠</text>
    <path d="M 65 80 C 45 110, 35 130, 50 145 C 60 155, 70 155, 80 145 C 95 130, 85 110, 65 80 Z" fill="#0f172a" />
    <path d="M 60 142 L 55 160 L 75 160 L 70 142 Z" fill="#0f172a" />
  </g>

  <!-- Right Card (Heart) -->
  <g transform="translate(302, 240) rotate(18) translate(-65, -95)" filter="url(#shadow)">
    <rect width="130" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <text x="14" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#dc2626">7</text>
    <text x="14" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#dc2626">♥</text>
    <path d="M 65 155 C 65 155, 30 120, 30 95 C 30 75, 45 65, 60 75 C 65 80, 65 80, 65 80 C 65 80, 65 80, 70 75 C 85 65, 100 75, 100 95 C 100 120, 65 155, 65 155 Z" fill="#dc2626" />
  </g>

  <!-- Center Card (Winning Gold "3" KORA) -->
  <g transform="translate(256, 235) translate(-70, -100)" filter="url(#shadow)">
    <rect width="140" height="200" rx="14" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" />
    <text x="16" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="url(#goldGrad)">3</text>
    <text x="16" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#eab308">♦</text>
    <!-- Center Diamond -->
    <path d="M 70 65 L 105 105 L 70 145 L 35 105 Z" fill="url(#goldGrad)" />
    <!-- Crown over the 3 -->
    <path d="M 50 170 L 55 185 L 85 185 L 90 170 L 78 178 L 70 165 L 62 178 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Gold Title Banner -->
  <g transform="translate(256, 435)" filter="url(#shadow)">
    <rect x="-160" y="-32" width="320" height="48" rx="24" fill="#020617" stroke="url(#goldGrad)" stroke-width="3" />
    <text x="0" y="2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="3" fill="url(#goldGrad)">NJAMBO KORA</text>
  </g>
</svg>
