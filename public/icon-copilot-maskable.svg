<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="copilotBgMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="copilotGoldMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="copilotGlowMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Full background bleed for safe zone maskable -->
  <rect width="512" height="512" fill="url(#copilotBgMaskable)" />
  
  <!-- Safe zone ambient glow circle -->
  <circle cx="256" cy="230" r="140" fill="url(#copilotGlowMaskable)" stroke="url(#copilotGoldMaskable)" stroke-width="4" stroke-dasharray="10 8" />

  <!-- AI Copilot Bot & Sparkle Motif centered within safe area -->
  <g transform="translate(256, 222)">
    <!-- Bot Antenna -->
    <line x1="0" y1="-106" x2="0" y2="-76" stroke="url(#copilotGoldMaskable)" stroke-width="8" stroke-linecap="round" />
    <circle cx="0" cy="-108" r="11" fill="#fef08a" />
    
    <!-- Bot Head -->
    <rect x="-80" y="-76" width="160" height="124" rx="32" fill="#0f172a" stroke="url(#copilotGoldMaskable)" stroke-width="5" />
    
    <!-- Bot Screen / Visor -->
    <rect x="-56" y="-50" width="112" height="56" rx="16" fill="#020617" stroke="#38bdf8" stroke-width="3" />
    
    <!-- Bot Glowing Eyes -->
    <circle cx="-28" cy="-22" r="12" fill="#38bdf8" />
    <circle cx="28" cy="-22" r="12" fill="#38bdf8" />
    <circle cx="-25" cy="-25" r="3.5" fill="#ffffff" />
    <circle cx="31" cy="-25" r="3.5" fill="#ffffff" />

    <!-- AI Sparkles -->
    <path d="M 76 -86 Q 76 -60 100 -60 Q 76 -60 76 -34 Q 76 -60 52 -60 Q 76 -60 76 -86 Z" fill="url(#copilotGoldMaskable)" />
    <path d="M -80 36 Q -80 50 -66 50 Q -80 50 -80 64 Q -80 50 -94 50 Q -80 50 -80 36 Z" fill="#38bdf8" />
  </g>

  <!-- Copilote Banner Badge in safe area -->
  <rect x="96" y="376" width="320" height="58" rx="29" fill="#0f172a" stroke="url(#copilotGoldMaskable)" stroke-width="3.5" />
  <text x="256" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" letter-spacing="4" fill="url(#copilotGoldMaskable)">COPILOTE</text>
</svg>
